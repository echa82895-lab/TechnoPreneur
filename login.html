<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ukk chelsya</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

     <nav class="navbar navbar-expand-lg sticky-top bg-primary">
        <div class="container">
            <a class="navbar-brand text-white" href="beranda">
            Lembaga Pelatih Dan Kursus
            </a>

            <!-- Button Hamburger -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Bagian Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="index.html">Beranda</a>
                    <a class="nav-link text-white" href="index.html">Tentang Kami</a>
                    <a class="nav-link text-white" href="index.html">Daftar Sertifikasi</a>
                    <a class="nav-link text-white" href="index.html">Kontak</a>
                    <a class="nav-link text-white" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-tiga align-items-center min-vh-100 d-flex">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 my-6">
            <div class="card p-4 rounded-4 shadow p-4 border-0 text-center">

                <form onsubmit="login(event)">
                <h4 class="text-center" mb-4 pt-5>Login</h4>
                <p>masukkan email dan password anda</p>

                <div class="text-start mb-3">
                  <label class="fw-bold">Email</label>
                  <input type="email"
                    id="email"
                     placeholder="email@gmail.com"
                    class="form-control rounded-3">
                </div>

                <div class="text-start mb-3">
                  <label class="fw-bold">Password</label>
                  <input
                    type="password"
                    id="password"
                    placeholder="******"
                    class="form-control rounded-3">
                </div>

                <div class="text-center mt-2">
                  <button type="submit" class="btn btn-primary w-100">
                    Login
                  </button>
                </div>

                <p class="mt-3">
                  Belum Punya Akun? <a href="register.html">Register</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="text-white bg-primary py-3">
      <div class="container">
        <p class="text-center">&copy; UKK 2026 - Techno Preneur</p>
        <p class="text-center">SMK Dinamika Pembangunan 2 Jakarta</p>
      </div>
    </footer>

    <script src="js/login.js"></script>
  </body>
